name: Free opportunity scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *' # 08:17 WIB
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scanner.py
      - uses: actions/upload-artifact@v4
        with:
          name: opportunity-report
          path: output/
          retention-days: 14
